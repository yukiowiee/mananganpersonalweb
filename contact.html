<!-- =========================
     LETTER / FORM
========================= -->

<div class="letter">

    <form
        action="https://formspree.io/f/xzepelbw"
        method="POST"
    >

        <label for="name">
            Your name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder=""
            required
        >

        <label for="email">
            Your email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder=""
            required
        >

        <label for="message">
            Your little message
        </label>

        <textarea
            id="message"
            name="message"
            rows="7"
            placeholder=""
            required
        ></textarea>

        <input
            type="hidden"
            name="_subject"
            value="New message from my scrapbook website"
        >

        <button
            type="submit"
            class="sticker-btn"
        >
            Send My Letter 💌
        </button>

    </form>

</div>

</style>

</body>
</html>
